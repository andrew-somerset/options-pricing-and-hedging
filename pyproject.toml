[project]
name = "options-pricing-and-hedging"
version = "0.1.0"
description = "Option pricing, Greeks, implied volatility and a delta-hedging cost experiment."
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "scipy>=1.18.1",
    "yfinance>=1.7.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/options_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
